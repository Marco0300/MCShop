<!doctype html><meta charset="utf-8"><title>MCShop LAN</title>
<style>body{font:15px system-ui;background:#111;color:#eee;margin:0}header{padding:14px;background:#222;display:flex;gap:10px;align-items:center}main{padding:16px;max-width:1200px;margin:auto}.card{background:#1d1d1d;border:1px solid #444;padding:12px;margin:8px 0;border-radius:6px}.item-icon{width:48px;height:48px;image-rendering:pixelated;object-fit:contain;float:right;margin-left:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}button,input{padding:8px;margin:4px;background:#333;color:#fff;border:1px solid #777;border-radius:4px}button{cursor:pointer}.muted{color:#aaa}.danger{color:#ff8888}</style>
<header><b>MCShop</b><span id="who" class="muted">Not logged in</span><span style="margin-left:auto"><button onclick="show('shop')">Shop</button><button onclick="show('bank')">Bank</button><button onclick="show('history')">History</button><button onclick="show('admin')">Admin</button></span></header><main><div id="app"></div></main>
<script>
let token=localStorage.mcshopToken||'';let items=[];let state={};const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
async function api(request){let q=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,request})}).then(r=>r.json());token=q.token;localStorage.mcshopToken=token;for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,250));let x=await fetch('/api/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:q.id})}).then(r=>r.json());if(x.ready)return x.response}return {success:false,error:'Bridge timeout'}}
function msg(x){return x.success?'':`<div class="danger">${esc(x.error||'Request failed')}</div>`}
async function login(){let u=prompt('Minecraft username');if(!u)return;let x=await api({action:'request_pin',username:u});alert(x.message||x.error);if(!x.success)return;let p=prompt('Enter the PIN whispered in Minecraft');x=await api({action:'verify_pin',username:u,pin:p});if(x.success){state.user=x.username;state.balance=x.balance;$('who').textContent=x.username+' · '+x.balance;show('shop')}else alert(x.error)}
function loginForm(){return `<div class="card"><b>Player login</b><br><span class="muted">Enter your Minecraft username. A one-time PIN will be whispered in-game.</span><br><input id="loginUser" placeholder="Minecraft username"><button onclick="login()">Request PIN</button><div id="loginMsg" class="muted"></div></div>`}
async function load(){let x=await api({action:'catalog'});if(x.success){items=x.items;renderShop()}else $('app').innerHTML=msg(x)}
function itemImage(id){let p=id.split(':');return p.length===2&&p[0]==='minecraft'?`https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.21.1/assets/minecraft/textures/item/${p[1]}.png`:''}
function renderShop(){let q=(document.querySelector('#q')?.value||'').toLowerCase();let a=items.filter(x=>(x.name+' '+x.id).toLowerCase().includes(q));$('app').innerHTML=`<h2>Shop</h2>${state.user?'':loginForm()}<input id="q" placeholder="Search items" value="${esc(q)}" oninput="renderShop()"><div class="grid">${a.map(x=>`<div class="card">${itemImage(x.id)?`<img class="item-icon" src="${itemImage(x.id)}" alt="" onerror="this.style.display='none'">`:''}<b>${esc(x.name)}</b><div class="muted">${esc(x.id)}</div><div>Buy ${x.buy} · Sell ${x.sell}</div><input id="n_${esc(x.id)}" type="number" min="1" max="64" value="1"><button onclick="trade('${esc(x.id)}','buy')">Buy</button><button onclick="trade('${esc(x.id)}','sell')">Sell</button></div>`).join('')}</div>`}
async function trade(id,action){if(!state.user){await login();return}let n=prompt('Quantity (1-64)','1');if(!n)return;let x=await api({action,item:id,quantity:Number(n)});if(x.success){state.balance=x.balance;$('who').textContent=state.user+' · '+state.balance;alert(action+' complete: '+x.amount)}else alert(x.error)}
async function show(p){if(p==='shop'){load();return}if(!state.user&&p!=='admin'){ $('app').innerHTML='<div class="card"><h2>Login required</h2><button onclick="login()">Login with Minecraft PIN</button></div>';return}if(p==='bank')return bank();if(p==='history')return history();if(p==='admin')return adminLogin()}
async function bank(){let x=await api({action:'balance'});$('app').innerHTML=`<h2>Bank</h2>${msg(x)}<div class="card">Balance: ${x.balance??state.balance}</div><button onclick="transfer()">Transfer</button><button onclick="loan()">Loan application/status</button>`}
async function transfer(){let target=prompt('Recipient username'),amount=prompt('Amount');if(target&&amount){let x=await api({action:'transfer',target,amount:Number(amount)});alert(x.error||'Transfer complete');bank()}}
async function loan(){let x=await api({action:'loan_status'});let text=x.loan?JSON.stringify(x.loan,null,2):'No loan';let amount=prompt(text+'\nEnter loan amount, or Cancel');if(amount){x=await api({action:'loan_quote',amount:Number(amount)});if(x.success&&confirm(JSON.stringify(x.quote,null,2)+'\nApply?'))x=await api({action:'loan_request',amount:Number(amount)});alert(x.error||'Application submitted')}bank()}
async function history(){let x=await api({action:'history'});$('app').innerHTML='<h2>Transaction history</h2>'+msg(x)+'<div class="card">'+(x.transactions||[]).slice().reverse().map(t=>esc(JSON.stringify(t))).join('<br>')+'</div>'}
async function adminLogin(){let key=prompt('Admin key');if(!key)return;let x=await api({action:'admin_login',key});if(!x.success){alert(x.error);return}admin()}
async function admin(){let x=await api({action:'admin_accounts'});$('app').innerHTML=`<h2>Admin panel</h2><button onclick="admin()">Refresh accounts</button><button onclick="adminCatalog()">Catalog/prices</button><button onclick="adminLoans()">Loans</button><div class="card"><h3>Accounts</h3>${(x.accounts||[]).map(a=>`<div>${esc(a.username)}: ${a.balance} <button onclick="setBalance('${esc(a.username)}')">Edit</button></div>`).join('')}</div>`}
async function setBalance(u){let a=prompt('New balance');if(a){let x=await api({action:'admin_balance',username:u,mode:'set',amount:Number(a)});alert(x.error||'Saved');admin()}}
async function adminCatalog(){let x=await api({action:'admin_catalog'});$('app').innerHTML='<h2>Catalog prices</h2><button onclick="admin()">Back</button><div class="grid">'+(x.items||[]).map(a=>`<div class="card"><b>${esc(a.name)}</b><br>Buy ${a.buy} / Sell ${a.sell}<br><button onclick="price('${esc(a.id)}',${a.buy},${a.sell})">Edit</button></div>`).join('')+'</div>'}
async function price(id,b,s){let x=await api({action:'admin_set_price',item:id,buy:Number(prompt('Buy',b)),sell:Number(prompt('Sell',s))});alert(x.error||'Saved');adminCatalog()}
async function adminLoans(){let x=await api({action:'admin_loans'});$('app').innerHTML='<h2>Loans</h2><button onclick="admin()">Back</button>'+((x.loans||[]).map(l=>`<div class="card">${esc(l.username)} · ${l.status} · remaining ${l.remaining} · arrears ${l.arrears} ${l.status==='pending'?`<button onclick="decide('${esc(l.username)}','approve')">Approve</button><button onclick="decide('${esc(l.username)}','reject')">Reject</button>`:''}</div>`).join(''))}
async function decide(username,decision){let x=await api({action:'admin_loan_decide',username,decision});alert(x.error||decision);adminLoans()}show('shop');
</script>
